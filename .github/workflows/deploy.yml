name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: collect-devops-496312
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/1037997396349/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: github-deployer@collect-devops-496312.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
    - run: gcloud auth list
