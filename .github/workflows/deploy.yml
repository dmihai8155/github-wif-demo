name: Deploy

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: collect-devops-496312
  REGION: europe-west1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/1037997396349/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: github-deployer@collect-devops-496312.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
    - run: gcloud auth list
    - run: |
        gcloud auth configure-docker \
        europe-west1-docker.pkg.dev

    - run: |
        docker build \
        -t europe-west1-docker.pkg.dev/$PROJECT_ID/github-demo/app:latest .

    - run: |
        docker push \
        europe-west1-docker.pkg.dev/$PROJECT_ID/github-demo/app:latest

    - run: |
        gcloud run deploy github-demo \
        --image=europe-west1-docker.pkg.dev/$PROJECT_ID/github-demo/app:latest \
        --region=$REGION \
        --allow-unauthenticated
